<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scène A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('vr-player', {
      schema: {
        speed: {type: 'number', default: 3},
        turnSpeed: {type: 'number', default: 2}
      },

      init: function () {
        this.moveAxis = [0, 0];
        this.turnAxis = 0;

        this.onMove = (event) => {
          this.moveAxis = event.detail.axis || [0, 0];
        };
        this.onTurn = (event) => {
          this.turnAxis = (event.detail.axis || [0, 0])[0];
        };

        this.leftController = this.el.querySelector('#left-controller');
        this.rightController = this.el.querySelector('#right-controller');
        this.leftController.addEventListener('thumbstickmoved', this.onMove);
        this.rightController.addEventListener('thumbstickmoved', this.onTurn);
      },

      tick: function (time, delta) {
        const elapsed = Math.min(delta, 100) / 1000;
        const moveX = this.moveAxis[0];
        const moveZ = this.moveAxis[1];
        const yaw = THREE.MathUtils.degToRad(this.el.object3D.rotation.y);
        const distance = this.data.speed * elapsed;

        this.el.object3D.position.x += (moveX * Math.cos(yaw) - moveZ * Math.sin(yaw)) * distance;
        this.el.object3D.position.z += (moveX * Math.sin(yaw) + moveZ * Math.cos(yaw)) * distance;
        this.el.object3D.rotation.y -= this.turnAxis * this.data.turnSpeed * elapsed;
      },

      remove: function () {
        this.leftController.removeEventListener('thumbstickmoved', this.onMove);
        this.rightController.removeEventListener('thumbstickmoved', this.onTurn);
      }
    });
  </script>
</head>
<body>
  <a-scene renderer="shadows: enabled" background="color: #87ceeb">
    <!-- Éclairage uniforme de la scène -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>

    <!-- Lumière directionnelle produisant des ombres -->
    <a-entity
      light="type: directional; color: #ffffff; intensity: 1.2; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048"
      position="-3 6 4"
      rotation="-45 -30 0">
    </a-entity>

    <!-- Sol : reçoit les ombres -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#6b8e23"
      shadow="receive: true">
    </a-plane>

    <!-- Objets : projettent et reçoivent les ombres -->
    <a-box
      position="-1 1 -3"
      rotation="0 30 0"
      width="2"
      height="2"
      depth="2"
      color="#e74c3c"
      shadow="cast: true; receive: true">
    </a-box>

    <a-sphere
      position="2 1 -4"
      radius="1"
      color="#3498db"
      shadow="cast: true; receive: true">
    </a-sphere>

    <!-- Rig du joueur : les contrôleurs et la caméra se déplacent ensemble -->
    <a-entity id="player" vr-player position="0 0 7">
      <a-camera position="0 1.6 0" rotation="-15 0 0"></a-camera>

      <!-- Stick gauche : déplacement avant/arrière et gauche/droite -->
      <a-entity
        id="left-controller"
        laser-controls="hand: left"
        raycaster="objects: .interactive"
        position="-0.2 1.2 -0.4">
      </a-entity>

      <!-- Stick droit : rotation de la vue -->
      <a-entity
        id="right-controller"
        laser-controls="hand: right"
        raycaster="objects: .interactive"
        position="0.2 1.2 -0.4">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
