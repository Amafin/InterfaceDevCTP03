<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scène A-Frame - Physique & Lancer</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Moteur physique Cannon.js compatible A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // Contrôle de la vue et déplacement aux joysticks
    // -------------------------------------------------------------
    AFRAME.registerComponent('vr-player', {
      schema: {
        speed: {type: 'number', default: 3},
        turnSpeed: {type: 'number', default: 2},
        elevateSpeed: {type: 'number', default: 2}
      },

      init: function () {
        this.moveAxis = [0, 0];
        this.turnAxis = 0;
        this.elevateAxis = 0;

        this.onMove = (e) => {
          this.moveAxis = [e.detail.x || 0, e.detail.y || 0];
        };
        this.onRightStick = (e) => {
          this.turnAxis = e.detail.x || 0;
          this.elevateAxis = e.detail.y || 0;
        };

        this.leftController = this.el.querySelector('#left-controller');
        this.rightController = this.el.querySelector('#right-controller');
        this.camera = this.el.querySelector('a-camera');

        this.leftController.addEventListener('thumbstickmoved', this.onMove);
        this.rightController.addEventListener('thumbstickmoved', this.onRightStick);
      },

      tick: function (time, delta) {
        const dt = Math.min(delta, 100) / 1000;

        if (Math.abs(this.turnAxis) > 0.1) {
          this.el.object3D.rotation.y -= this.turnAxis * this.data.turnSpeed * dt;
        }
        if (Math.abs(this.elevateAxis) > 0.1) {
          this.el.object3D.position.y -= this.elevateAxis * this.data.elevateSpeed * dt;
        }

        const moveX = this.moveAxis[0];
        const moveZ = this.moveAxis[1];
        if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
          const camYaw = this.camera ? this.camera.object3D.rotation.y : 0;
          const totalYaw = this.el.object3D.rotation.y + camYaw;
          const dist = this.data.speed * dt;

          this.el.object3D.position.x += (moveX * Math.cos(totalYaw) + moveZ * Math.sin(totalYaw)) * dist;
          this.el.object3D.position.z += (-moveX * Math.sin(totalYaw) + moveZ * Math.cos(totalYaw)) * dist;
        }
      }
    });

    // -------------------------------------------------------------
    // Composant de lancer & saisie avec calcul de vélocité
    // -------------------------------------------------------------
    AFRAME.registerComponent('physics-thrower', {
      init: function () {
        this.grabbedEl = null;
        this.targetEl = null;

        // Historique de positions mondiales pour calculer la vitesse du lancer
        this.prevPos = new THREE.Vector3();
        this.currPos = new THREE.Vector3();
        this.velocity = new THREE.Vector3();

        // Détection laser
        this.el.addEventListener('raycaster-intersection', (e) => {
          const valid = e.detail.els.filter(el => el.classList.contains('grabbable'));
          if (valid.length > 0) this.targetEl = valid[0];
        });

        this.el.addEventListener('raycaster-intersection-cleared', () => {
          this.targetEl = null;
        });

        // Début saisie (Trigger ou Grip)
        const grabStart = () => {
          if (!this.targetEl || this.grabbedEl) return;
          this.grabbedEl = this.targetEl;

          // Désactive la simulation physique pendant la tenue en main
          if (this.grabbedEl.body) {
            this.grabbedEl.body.mass = 0;
            this.grabbedEl.body.updateMassProperties();
            this.grabbedEl.body.velocity.set(0, 0, 0);
            this.grabbedEl.body.angularVelocity.set(0, 0, 0);
          }

          // Lie l'objet au contrôleur
          this.grabbedEl.sceneEl.object3D.attach(this.grabbedEl.object3D);
          this.el.object3D.attach(this.grabbedEl.object3D);
        };

        // Relâchement et lancer
        const grabEnd = () => {
          if (!this.grabbedEl) return;

          // Replace l'objet dans la scène globale
          this.el.sceneEl.object3D.attach(this.grabbedEl.object3D);

          const el = this.grabbedEl;
          const body = el.body;

          if (body) {
            // Réactive la physique et la masse
            body.mass = 1;
            body.updateMassProperties();

            // Synchronise les positions du moteur physique avec la 3D
            const worldPos = new THREE.Vector3();
            el.object3D.getWorldPosition(worldPos);
            body.position.copy(worldPos);

            // Applique la vélocité accumulée par le geste
            body.velocity.set(this.velocity.x, this.velocity.y, this.velocity.z);
          }

          this.grabbedEl = null;
        };

        this.el.addEventListener('triggerdown', grabStart);
        this.el.addEventListener('gripdown', grabStart);
        this.el.addEventListener('triggerup', grabEnd);
        this.el.addEventListener('gripup', grabEnd);
      },

      tick: function (time, delta) {
        if (delta === 0) return;
        const dt = Math.min(delta, 100) / 1000;

        // Mesure la vitesse globale du contrôleur dans la scène
        this.el.object3D.getWorldPosition(this.currPos);
        this.velocity.subVectors(this.currPos, this.prevPos).divideScalar(dt);
        this.prevPos.copy(this.currPos);
      }
    });
  </script>
</head>
<body>
  <!-- Activation du moteur Cannon.js (debug: false masque les maillages de collision) -->
  <a-scene physics="debug: false; gravity: -9.8" renderer="shadows: enabled" background="color: #87ceeb">

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 1.2; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048"
      position="-3 6 4">
    </a-entity>

    <!-- Sol statique (ne bouge pas, bloque les chutes) -->
    <a-plane
      static-body
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#6b8e23"
      shadow="receive: true">
    </a-plane>

    <!-- Objets dynamiques (collisions mutuelles, gravité, empilables) -->
    <a-box
      class="grabbable"
      dynamic-body="mass: 1; shape: box"
      position="-0.8 2 -3"
      rotation="0 15 0"
      width="0.8" height="0.8" depth="0.8"
      color="#e74c3c"
      shadow="cast: true; receive: true">
    </a-box>

    <a-box
      class="grabbable"
      dynamic-body="mass: 1; shape: box"
      position="-0.8 0.5 -3"
      rotation="0 15 0"
      width="0.8" height="0.8" depth="0.8"
      color="#f39c12"
      shadow="cast: true; receive: true">
    </a-box>

    <a-sphere
      class="grabbable"
      dynamic-body="mass: 1; shape: sphere"
      position="1 2 -3"
      radius="0.5"
      color="#3498db"
      shadow="cast: true; receive: true">
    </a-sphere>

    <!-- Rig du joueur -->
    <a-entity id="player" vr-player position="0 0 3">
      <a-camera position="0 1.6 0"></a-camera>

      <a-entity
        id="left-controller"
        physics-thrower
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .grabbable; far: 4">
      </a-entity>

      <a-entity
        id="right-controller"
        physics-thrower
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .grabbable; far: 4">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
