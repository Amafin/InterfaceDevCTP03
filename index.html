<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scène A-Frame - Arme en main & Tir tendu</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // Déplacement et vue aux joysticks
    // -------------------------------------------------------------
    AFRAME.registerComponent('vr-player', {
      schema: {
        speed: {type: 'number', default: 3},
        turnSpeed: {type: 'number', default: 2},
        elevateSpeed: {type: 'number', default: 2}
      },

      init: function () {
        this.moveAxis = [0, 0];
        this.turnAxis = 0;
        this.elevateAxis = 0;

        this.onMove = (e) => {
          this.moveAxis = [e.detail.x || 0, e.detail.y || 0];
        };
        this.onRightStick = (e) => {
          this.turnAxis = e.detail.x || 0;
          this.elevateAxis = e.detail.y || 0;
        };

        this.leftController = this.el.querySelector('#left-controller');
        this.rightController = this.el.querySelector('#right-controller');
        this.camera = this.el.querySelector('a-camera');

        this.leftController.addEventListener('thumbstickmoved', this.onMove);
        this.rightController.addEventListener('thumbstickmoved', this.onRightStick);
      },

      tick: function (time, delta) {
        const dt = Math.min(delta, 100) / 1000;

        if (Math.abs(this.turnAxis) > 0.1) {
          this.el.object3D.rotation.y -= this.turnAxis * this.data.turnSpeed * dt;
        }
        if (Math.abs(this.elevateAxis) > 0.1) {
          this.el.object3D.position.y -= this.elevateAxis * this.data.elevateSpeed * dt;
        }

        const moveX = this.moveAxis[0];
        const moveZ = this.moveAxis[1];
        if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
          const camYaw = this.camera ? this.camera.object3D.rotation.y : 0;
          const totalYaw = this.el.object3D.rotation.y + camYaw;
          const dist = this.data.speed * dt;

          this.el.object3D.position.x += (moveX * Math.cos(totalYaw) + moveZ * Math.sin(totalYaw)) * dist;
          this.el.object3D.position.z += (-moveX * Math.sin(totalYaw) + moveZ * Math.cos(totalYaw)) * dist;
        }
      }
    });

    // -------------------------------------------------------------
    // Composant de l'arme : tir tendu sans chute
    // -------------------------------------------------------------
    AFRAME.registerComponent('gun', {
      schema: {
        bulletSpeed: { type: 'number', default: 30 }
      },

      shoot: function () {
        const scene = this.el.sceneEl;
        const muzzle = this.el.querySelector('#muzzle');

        const spawnPos = new THREE.Vector3();
        if (muzzle) {
          muzzle.object3D.getWorldPosition(spawnPos);
        } else {
          this.el.object3D.getWorldPosition(spawnPos);
        }

        // Direction visée par le canon (-Z de l'arme)
        const forward = new THREE.Vector3(0, 0, -1);
        const worldQuat = new THREE.Quaternion();
        this.el.object3D.getWorldQuaternion(worldQuat);
        forward.applyQuaternion(worldQuat).normalize();

        const bullet = document.createElement('a-sphere');
        bullet.setAttribute('radius', '0.04');
        bullet.setAttribute('color', '#f1c40f');
        bullet.setAttribute('position', `${spawnPos.x} ${spawnPos.y} ${spawnPos.z}`);
        bullet.setAttribute('dynamic-body', 'mass: 0.1; shape: sphere');
        bullet.setAttribute('shadow', 'cast: true');

        // Composant pour neutraliser la gravité sur la balle et la maintenir droite
        bullet.setAttribute('bullet-flight', `vx: ${forward.x * this.data.bulletSpeed}; vy: ${forward.y * this.data.bulletSpeed}; vz: ${forward.z * this.data.bulletSpeed}`);

        scene.appendChild(bullet);

        setTimeout(() => {
          if (bullet.parentNode) bullet.parentNode.removeChild(bullet);
        }, 3000);
      }
    });

    // Maintient la vélocité constante en ligne droite
    AFRAME.registerComponent('bullet-flight', {
      schema: {
        vx: { type: 'number', default: 0 },
        vy: { type: 'number', default: 0 },
        vz: { type: 'number', default: 0 }
      },
      tick: function () {
        if (this.el.body) {
          this.el.body.velocity.set(this.data.vx, this.data.vy, this.data.vz);
        }
      }
    });

    // -------------------------------------------------------------
    // Grabber avec Snap pour l'arme et Offset pour les autres
    // -------------------------------------------------------------
    AFRAME.registerComponent('physics-grabber', {
      schema: {
        throwMultiplier: { type: 'number', default: 1.4 }
      },

      init: function () {
        this.grabbedEl = null;
        this.targetEl = null;
        this.isGun = false;

        this.positions = [];
        this.handWorldPos = new THREE.Vector3();
        this.handWorldQuat = new THREE.Quaternion();

        this.grabOffsetPos = new THREE.Vector3();
        this.grabOffsetQuat = new THREE.Quaternion();

        this._tmpObjPos = new THREE.Vector3();
        this._tmpObjQuat = new THREE.Quaternion();
        this._tmpInvHandQuat = new THREE.Quaternion();
        this._tmpTargetPos = new THREE.Vector3();
        this._tmpTargetQuat = new THREE.Quaternion();

        this.el.addEventListener('raycaster-intersection', (e) => {
          const valid = e.detail.els.filter(el => el.classList.contains('grabbable'));
          if (valid.length > 0) this.targetEl = valid[0];
        });

        this.el.addEventListener('raycaster-intersection-cleared', () => {
          this.targetEl = null;
        });

        const onGrab = () => {
          if (!this.targetEl || this.grabbedEl) return;
          this.grabbedEl = this.targetEl;
          this.isGun = this.grabbedEl.hasAttribute('gun');
          this.positions = [];

          this.el.object3D.getWorldPosition(this.handWorldPos);
          this.el.object3D.getWorldQuaternion(this.handWorldQuat);

          if (this.isGun) {
            // SNAP EN MAIN : Calibré pour que la crosse s'aligne dans le poing du joueur
            this.grabOffsetPos.set(0, -0.04, -0.08);
            this.grabOffsetQuat.setFromAxisAngle(
              new THREE.Vector3(1, 0, 0),
              THREE.MathUtils.degToRad(-25)
          } else {
            // OBJETS CLASSIQUES : Conserve la distance et l'angle d'origine
            this.grabbedEl.object3D.getWorldPosition(this._tmpObjPos);
            this.grabbedEl.object3D.getWorldQuaternion(this._tmpObjQuat);

            this._tmpInvHandQuat.copy(this.handWorldQuat).conjugate();

            this.grabOffsetPos
              .copy(this._tmpObjPos)
              .sub(this.handWorldPos)
              .applyQuaternion(this._tmpInvHandQuat);

            this.grabOffsetQuat
              .copy(this._tmpInvHandQuat)
              .multiply(this._tmpObjQuat);
          }
        };

        const onRelease = () => {
          if (!this.grabbedEl) return;
          const body = this.grabbedEl.body;

          if (body && this.positions.length >= 2) {
            const oldest = this.positions[0];
            const newest = this.positions[this.positions.length - 1];
            const totalDt = (newest.time - oldest.time) / 1000;

            if (totalDt > 0.01) {
              const vx = ((newest.pos.x - oldest.pos.x) / totalDt) * this.data.throwMultiplier;
              const vy = ((newest.pos.y - oldest.pos.y) / totalDt) * this.data.throwMultiplier;
              const vz = ((newest.pos.z - oldest.pos.z) / totalDt) * this.data.throwMultiplier;

              body.velocity.set(vx, vy, vz);
            }
          }

          this.grabbedEl = null;
          this.isGun = false;
          this.positions = [];
        };

        const onTriggerDown = () => {
          if (this.grabbedEl && this.isGun) {
            this.grabbedEl.components['gun'].shoot();
          } else if (!this.grabbedEl) {
            onGrab();
          }
        };

        const onTriggerUp = () => {
          if (this.grabbedEl && !this.isGun) {
            onRelease();
          }
        };

        this.el.addEventListener('gripdown', onGrab);
        this.el.addEventListener('gripup', onRelease);
        this.el.addEventListener('triggerdown', onTriggerDown);
        this.el.addEventListener('triggerup', onTriggerUp);
      },

      tick: function (time, delta) {
        this.el.object3D.getWorldPosition(this.handWorldPos);
        this.el.object3D.getWorldQuaternion(this.handWorldQuat);

        this.positions.push({
          pos: this.handWorldPos.clone(),
          time: performance.now()
        });
        if (this.positions.length > 6) {
          this.positions.shift();
        }

        if (this.grabbedEl && this.grabbedEl.body) {
          const body = this.grabbedEl.body;

          this._tmpTargetPos
            .copy(this.grabOffsetPos)
            .applyQuaternion(this.handWorldQuat)
            .add(this.handWorldPos);

          this._tmpTargetQuat
            .copy(this.handWorldQuat)
            .multiply(this.grabOffsetQuat);

          body.position.set(this._tmpTargetPos.x, this._tmpTargetPos.y, this._tmpTargetPos.z);
          body.quaternion.set(this._tmpTargetQuat.x, this._tmpTargetQuat.y, this._tmpTargetQuat.z, this._tmpTargetQuat.w);

          body.velocity.set(0, 0, 0);
          body.angularVelocity.set(0, 0, 0);
        }
      }
    });
  </script>
</head>
<body>
  <a-scene physics="debug: false; gravity: -9.8" renderer="shadows: enabled" background="color: #87ceeb">

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 1.2; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048"
      position="-3 6 4">
    </a-entity>

    <a-plane
      static-body
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#6b8e23"
      shadow="receive: true">
    </a-plane>

    <!-- Cubes & Sphère (distance et orientation libres conservées) -->
    <a-box
      class="grabbable"
      dynamic-body="mass: 2; shape: box"
      position="-0.6 1.5 -1.2"
      rotation="0 15 0"
      width="0.5" height="0.5" depth="0.5"
      color="#e74c3c"
      shadow="cast: true; receive: true">
    </a-box>

    <a-box
      class="grabbable"
      dynamic-body="mass: 2; shape: box"
      position="-0.6 0.5 -1.2"
      rotation="0 15 0"
      width="0.5" height="0.5" depth="0.5"
      color="#f39c12"
      shadow="cast: true; receive: true">
    </a-box>

    <a-sphere
      class="grabbable"
      dynamic-body="mass: 2; shape: sphere"
      position="0.6 1.2 -1.2"
      radius="0.3"
      color="#3498db"
      shadow="cast: true; receive: true">
    </a-sphere>

    <!-- Arme à feu (se snap automatiquement au creux de la main dès qu'attrapée) -->
    <a-box
      id="pistol"
      class="grabbable"
      gun="bulletSpeed: 50"
      dynamic-body="mass: 1.5; shape: box"
      position="0 1 -0.8"
      width="0.08" height="0.08" depth="0.32"
      color="#2c3e50"
      shadow="cast: true; receive: true">

      <a-box
        width="0.06" height="0.14" depth="0.07"
        position="0 -0.09 0.08"
        rotation="15 0 0"
        color="#7f8c8d">
      </a-box>

      <a-entity id="muzzle" position="0 0 -0.2"></a-entity>
    </a-box>

    <!-- Rig du joueur -->
    <a-entity id="player" vr-player position="0 0 1.2">
      <a-camera position="0 1.6 0"></a-camera>

      <a-entity
        id="left-controller"
        physics-grabber
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .grabbable; far: 1.5">
      </a-entity>

      <a-entity
        id="right-controller"
        physics-grabber
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .grabbable; far: 1.5">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
