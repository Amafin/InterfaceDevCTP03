<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scène A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('vr-player', {
      schema: {
        speed: {type: 'number', default: 3},
        turnSpeed: {type: 'number', default: 2},
        elevateSpeed: {type: 'number', default: 2}
      },

      init: function () {
        this.moveAxis = [0, 0];
        this.turnAxis = 0;
        this.elevateAxis = 0;

        // Joystick gauche : Déplacement horizontal (avant/arrière, gauche/droite)
        this.onMove = (event) => {
          this.moveAxis = [event.detail.x || 0, event.detail.y || 0];
        };

        // Joystick droit : Rotation (x) et Élévation (y)
        this.onRightStick = (event) => {
          this.turnAxis = event.detail.x || 0;
          this.elevateAxis = event.detail.y || 0;
        };

        this.leftController = this.el.querySelector('#left-controller');
        this.rightController = this.el.querySelector('#right-controller');
        this.camera = this.el.querySelector('a-camera');

        this.leftController.addEventListener('thumbstickmoved', this.onMove);
        this.rightController.addEventListener('thumbstickmoved', this.onRightStick);
      },

      tick: function (time, delta) {
        const elapsed = Math.min(delta, 100) / 1000;

        // 1. Rotation de la vue (joystick droit - axe X)
        if (Math.abs(this.turnAxis) > 0.1) {
          this.el.object3D.rotation.y -= this.turnAxis * this.data.turnSpeed * elapsed;
        }

        // 2. Monter / Descendre (joystick droit - axe Y)
        // En poussant vers le haut (y < -0.1) on monte, en tirant vers le bas (y > 0.1) on descend
        if (Math.abs(this.elevateAxis) > 0.1) {
          this.el.object3D.position.y -= this.elevateAxis * this.data.elevateSpeed * elapsed;
        }

        // 3. Déplacement horizontal (joystick gauche)
        const moveX = this.moveAxis[0];
        const moveZ = this.moveAxis[1];

        if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
          let camYaw = 0;
          if (this.camera) {
            camYaw = this.camera.object3D.rotation.y;
          }
          const totalYaw = this.el.object3D.rotation.y + camYaw;
          const distance = this.data.speed * elapsed;

          this.el.object3D.position.x += (moveX * Math.cos(totalYaw) + moveZ * Math.sin(totalYaw)) * distance;
          this.el.object3D.position.z += (-moveX * Math.sin(totalYaw) + moveZ * Math.cos(totalYaw)) * distance;
        }
      },

      remove: function () {
        this.leftController.removeEventListener('thumbstickmoved', this.onMove);
        this.rightController.removeEventListener('thumbstickmoved', this.onRightStick);
      }
    });
  </script>
</head>
<body>
  <a-scene renderer="shadows: enabled" background="color: #87ceeb">
    <!-- Éclairage uniforme de la scène -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>

    <!-- Lumière directionnelle produisant des ombres -->
    <a-entity
      light="type: directional; color: #ffffff; intensity: 1.2; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048"
      position="-3 6 4"
      rotation="-45 -30 0">
    </a-entity>

    <!-- Sol : reçoit les ombres -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#6b8e23"
      shadow="receive: true">
    </a-plane>

    <!-- Objets : projettent et reçoivent les ombres -->
    <a-box
      position="-1 1 -3"
      rotation="0 30 0"
      width="2"
      height="2"
      depth="2"
      color="#e74c3c"
      shadow="cast: true; receive: true">
    </a-box>

    <a-sphere
      position="2 1 -4"
      radius="1"
      color="#3498db"
      shadow="cast: true; receive: true">
    </a-sphere>

    <!-- Rig du joueur -->
    <a-entity id="player" vr-player position="0 0 5">
      <a-camera position="0 1.6 0"></a-camera>

      <!-- Contrôleur gauche : Déplacement avant/arrière/gauche/droite -->
      <a-entity
        id="left-controller"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left">
      </a-entity>

      <!-- Contrôleur droit : Rotation gauche/droite + Montée/Descente -->
      <a-entity
        id="right-controller"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
